# Fortik for a design-partner pilot on one VM in the customer's VPC (Phase 6).
#
#   ./init.sh          # once: .env with random passwords and master key, TLS, bootstrap secrets
#   docker compose up -d
#
# Fortik's own Postgres, Redis and NATS live on an internal network with no
# published ports. Fortik publishes:
#   8443  API + console (TLS)
#   8090  app gateway + Claude Code hook endpoint (mutual TLS)
#   6432  Postgres proxy for agents (TLS required, client certificates)
#   9091  agentgateway callout (mutual TLS, gRPC)
# The Fortik containers run as the host user that ran init.sh (non-root,
# read-only root filesystem, no capabilities).
name: fortik

x-fortik: &fortik
  image: ${FORTIK_IMAGE:-fortik:dev}
  user: "${FORTIK_UID}:${FORTIK_GID}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  environment:
    FORTIK_MASTER_KEY: ${FORTIK_MASTER_KEY}
    FORTIK_APP_PASSWORD: ${FORTIK_APP_PASSWORD}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    FORTIK_PUBLIC_HOST: ${FORTIK_PUBLIC_HOST}
    FORTIK_ENFORCEMENT_MODE: ${FORTIK_ENFORCEMENT_MODE:-observe}
  volumes:
    - ./fortik.yaml:/etc/fortik/fortik.yaml:ro
    - ./tls:/etc/fortik/tls:ro
    - ./data/secrets:/var/lib/fortik/secrets
    - ./data/spool:/var/lib/fortik/spool

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FORTIK_OWNER_PASSWORD: ${FORTIK_OWNER_PASSWORD}
      FORTIK_APP_PASSWORD: ${FORTIK_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-fortik.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fortik"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [natsdata:/data]
    networks: [backend]
    restart: unless-stopped

  migrate:
    <<: *fortik
    command: ["migrate", "-config", "/etc/fortik/fortik.yaml", "-grant-app", "fortik_app"]
    environment:
      FORTIK_MASTER_KEY: ${FORTIK_MASTER_KEY}
      FORTIK_DATABASE_URL: postgres://fortik_owner:${FORTIK_OWNER_PASSWORD}@postgres:5432/fortik?sslmode=disable
      FORTIK_APP_PASSWORD: ${FORTIK_APP_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FORTIK_PUBLIC_HOST: ${FORTIK_PUBLIC_HOST}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    restart: "no"

  fortik:
    <<: *fortik
    command: ["serve", "-config", "/etc/fortik/fortik.yaml"]
    ports:
      - "8443:8443"
      - "8090:8090"
      - "6432:6432"
      - "9091:9091"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      nats: {condition: service_started}
    healthcheck:
      test: ["CMD", "/usr/local/bin/fortik", "healthz", "-url", "https://127.0.0.1:8443/healthz", "-ca", "/etc/fortik/tls/ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend, frontend]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  natsdata:

networks:
  backend:
    internal: true # Postgres, Redis and NATS are unreachable from outside
  frontend:
