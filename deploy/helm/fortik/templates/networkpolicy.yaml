{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fortik.fullname" . }}
  labels: {{- include "fortik.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fortik.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8443}
        - {port: 8090}
        - {port: 6432}
        - {port: 9091}
      {{- if .Values.networkPolicy.allowFromNamespaces }}
      from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      {{- end }}
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        {{- range .Values.networkPolicy.egressCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
{{- end }}
