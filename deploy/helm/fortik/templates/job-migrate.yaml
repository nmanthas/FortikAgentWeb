# Migrations and the application role's least-privilege grants, before every
# install and upgrade (runs as the schema owner; the server never does).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fortik.fullname" . }}-migrate
  labels: {{- include "fortik.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{- include "fortik.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "fortik.fullname" . }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "-config", "/etc/fortik/fortik.yaml", "-grant-app", "fortik_app"]
          env:
            {{- include "fortik.env" . | nindent 12 }}
            - name: FORTIK_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: owner-database-url}}
          securityContext: {{- include "fortik.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/fortik/fortik.yaml, subPath: fortik.yaml, readOnly: true}
            - {name: secrets, mountPath: /var/lib/fortik/secrets}
      volumes:
        - name: config
          configMap: {name: {{ include "fortik.fullname" . }}}
        - name: secrets
          {{- if and (eq .Values.config.secrets.provider "encfile") .Values.secretStore.encfilePersistence }}
          persistentVolumeClaim: {claimName: {{ include "fortik.fullname" . }}-secrets}
          {{- else }}
          emptyDir: {}
          {{- end }}
