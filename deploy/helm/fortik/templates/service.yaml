apiVersion: v1
kind: Service
metadata:
  name: {{ include "fortik.fullname" . }}
  labels: {{- include "fortik.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "fortik.selector" . | nindent 4 }}
  ports:
    - {name: api, port: 8443, targetPort: api}
    - {name: gateway, port: 8090, targetPort: gateway}
    - {name: pgproxy, port: 6432, targetPort: pgproxy}
    - {name: agentgw, port: 9091, targetPort: agentgw, appProtocol: grpc}
