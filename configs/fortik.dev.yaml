# Fortik local development config (Phase 1). Contains NO secrets: every
# credential is referenced by name and read from the secret provider
# (.dev/secrets, generated by scripts/dev-up.sh).
#
# The dev Postgres cluster uses trust auth on 127.0.0.1 only, so the DSN has
# no password. In pilots set FORTIK_DATABASE_URL from your secret manager.
database_url: postgres://fortik_app@127.0.0.1:55432/fortik?sslmode=disable
log_level: info

api:
  enabled: true
  listen: 127.0.0.1:8080
  tokens_secret: api_tokens

policy:
  dir: policies
  hot_reload: true
  poll_every: 2s

diary:
  signing_key_secret: diary_signing_key

secrets:
  # Encrypted files (AES-256-GCM). The master key lives outside the secret dir;
  # in pilots supply it via FORTIK_MASTER_KEY from your KMS, or use provider: vault.
  provider: encfile
  dir: .dev/secrets-enc
  master_key_file: .dev/master.key

fail:
  # READs allowed when Fortik cannot decide. Empty = everything fails closed.
  green_read_allowlist: []

pgproxy:
  enabled: true
  listen: 127.0.0.1:6432
  agent_tokens_secret: agent_tokens
  pre_query_timeout: 3s
  # Upstreams come from the console's Integrations screen (postgres:<name>);
  # scripts/dev-up.sh seeds postgres:acme_prod and postgres:acme_staging.
  upstreams: {}
  data_labels:
    - match: public.customers
      labels: [customer_pii]
    - match: "*.payments"
      labels: [financial]

gateway:
  enabled: true
  listen: 127.0.0.1:8090

broker:
  aws_session_ttl: 15m
  postgres_session_ttl: 15m

auth:
  # Local development only (refused unless api.listen is loopback). Configure
  # auth.oidc for real logins.
  dev_login:
    enabled: true
    users:
      - {email: admin@acme.com, name: Admin, roles: [admin]}
      - {email: security@acme.com, name: Alex Chen (Security), roles: [security, auditor]}
      - {email: pranav.kumar@acme.com, name: pranav Kumar (owner of claude_code_01), roles: [auditor]}
      - {email: auditor@acme.com, name: Auditor, roles: [auditor]}

events:
  provider: memory

ladder:
  yellow_holds_threshold: 3
  yellow_window: 10m

console:
  enabled: true

undo:
  snapshot_retention: 720h   # 30 days (plan)
  trash_retention: 168h      # 7 days (plan)

# --- Phase 3 ----------------------------------------------------------------
delegation:
  signing_key_secret: delegation/signing_key   # auto-created in the secret store
  token_ttl: 15m
  max_depth: 5
  bypass_origin_level: SUPERVISED              # originating agent of a blocked bypass steps down here

population:
  heartbeat_interval: 15s
  stale_after: 45s
  spike_cooldown: 5m

counters:
  provider: memory          # use redis (redis_url) when running more than one Fortik process

approvals:
  grant_ttl: 15m
  allow_owner_approval: false
  # Dev only: the demo plays both approvers of a two-person rule with two API
  # tokens (security + admin). Production keeps the default (false): at most
  # one of the two votes may come from a token.
  allow_token_pairs: true

overrides:
  sweep_interval: 5s

agentgw:
  enabled: true
  listen: 127.0.0.1:9091    # gRPC callout for agentgateway (MCP / A2A / HTTP egress)
  internal_hosts: [acme.com, "*.acme.internal", localhost, 127.0.0.1]

hook:
  proxy_hosts: ["127.0.0.1:6432", "localhost:6432"]   # psql to these goes through Fortik's proxy

# --- Phase 4 ----------------------------------------------------------------
memory:
  promotion_delay: 10m      # staged memory writes are promoted after this unless flagged (undo #6)
  promotion_poll: 30s
  snapshot_every: 1h        # automatic clean snapshots of every namespace (0 = manual only)
  snapshot_retention: 720h  # 30 days

retention:
  sweep_interval: 1h        # purge expired undo snapshots, trash tables and memory snapshots

# --- Phase 5 ----------------------------------------------------------------
swarm:
  breaker_n: 5              # Max-5: the 6th distinct agent/copy doing the same action trips the breaker
  breaker_window: 10m
  fanout_limit: 10          # children one root may spawn in the window
  converge_n: 8             # distinct agents hitting one target in the window
  converge_window: 10m
  sweep_interval: 15s

map:
  window: 5m                # edges are rolled up per 5-minute window
  rollup_interval: 10s
  retention: 720h           # 30 days of replay
  encoded_param_min: 256    # hidden signal: encoded URL parameter size threshold

shadow:
  sweep_interval: 15m       # standing-credential discovery (0 = manual only)
  postgres_exclude_roles: [acme_agent, fortik_app, fortik_owner, acme_memory_admin]

baseline:
  days: 14
  sigma: 3
  median_factor: 5
  min_history_days: 3
  min_count: 20
